name: xibo-player
base: core24
version: '4.0.9'
summary: Xibo Linux Player
description: Xibo for Linux Digital Signage Player
confinement: strict
# Must be 'stable' to be publishable to the stable channel. Devices running the legacy 1.8
# player refresh in place from this same snap name, so a 'devel' grade blocks the upgrade.
grade: stable

apps:
  xibo-player:
    extensions: [gnome]
    command: xibo-player --no-sandbox
    plugs:
      # The Chromium sandbox is disabled above, so browser-support is not required and is
      # deliberately omitted: it is not auto-connected, and an unconnected plug on refresh
      # would silently break every migrated device.
      - home
      - network
      - network-bind
      - opengl
      - audio-playback
      - screen-inhibit-control
      - x11
      # Carried over from the legacy 1.8 snap, which shipped both of these.
      - gsettings
      - framebuffer
    environment:
      TMPDIR: $XDG_RUNTIME_DIR
      LIBGL_ALWAYS_SOFTWARE: '0'
      # Force the loader to look in the internal library path first
      LD_LIBRARY_PATH: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET:$SNAP/lib/$SNAPCRAFT_ARCH_TRIPLET:$LD_LIBRARY_PATH

parts:
  app:
    plugin: dump
    source:
      - on amd64: out/xibo-player-linux-x64
      - on arm64: out/xibo-player-linux-arm64
    # STRATEGY: Move custom libraries into the standard system path
    # This prevents 'not found' errors because the loader checks here by default.
    organize:
      libOSSlib.so: usr/lib/x86_64-linux-gnu/libOSSlib.so
      libpxbackend-1.0.so: usr/lib/x86_64-linux-gnu/libpxbackend-1.0.so
    
    stage-packages:
      # Use the 't64' versions for Core24/Ubuntu 24.04 compatibility
      - libglib2.0-0t64
      - libproxy1v5            
      - glib-networking        
      - libnss3
      - libnspr4
      - libatk1.0-0t64
      - libatk-bridge2.0-0t64
      - libcups2
      - libdrm2
      - libxkbcommon0
      - libxcomposite1
      - libxdamage1
      - libxfixes3
      - libxrandr2
      - libgbm1
      - libasound2t64
      - libpangocairo-1.0-0
      - libpango-1.0-0
      - libcairo2
      - libgtk-3-0t64
      - libgl1
