name: 'Release & Publish'

# Runs automatically when a GitHub release is created, building and publishing every
# platform.
#
# It can also be run by hand, which exists for one reason: proving out a change to
# this workflow without cutting a release. A release-triggered run executes the
# workflow file as it was AT THE TAG, so a fix here is otherwise untestable until it
# has been tagged. A manual run executes the file from whichever ref is dispatched,
# so a branch can be tested directly.
#
# Manual runs default to building Windows only and uploading nothing, because the
# common case is testing installer signing. Note that a manual run builds the code on
# the dispatched ref, NOT the code at the tag, so leave 'upload' off unless the
# intention really is to replace that release's assets.
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to work against'
        required: true
        type: string
      platforms:
        description: 'Which installers to build'
        required: true
        type: choice
        default: 'windows'
        options:
          - windows
          - linux
          - both
      upload:
        description: 'Upload the results to the release (and publish the snap)'
        required: false
        type: boolean
        default: false

env:
  # A manual run has no release payload, so the tag comes from the input instead.
  # Every step that touches the release reads this rather than the event directly.
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

  # Whether this run is allowed to change anything outside the workflow: release
  # assets and the Snap Store. Always true for a real release.
  PUBLISH: ${{ github.event_name == 'release' || inputs.upload }}

jobs:
  build-linux:
    # We'll run on Ubuntu as it's required for .deb and .snap packages
    runs-on: ubuntu-latest

    # Skipped when a manual run asks for Windows only, which is the usual case.
    if: github.event_name == 'release' || inputs.platforms != 'windows'

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 'Install Snapcraft'
        run: |
          sudo snap install snapcraft --classic

      - name: 'Install Dependencies'
        run: npm ci

      - name: 'Build Application Packages'
        run: npm run make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Set Snap Version'
        run: node scripts/set-snap-version.cjs

      - name: 'Pack Snap'
        id: snap-build
        run: |
          mkdir -p out/make/snap/x64/
          # --destructive-mode allows building without a VM/Container
          sudo snapcraft pack --output out/make/snap/x64/ --destructive-mode
          # Set the snap path as an output for the next steps
          SNAP_PATH=$(find ./out/make/snap -name '*.snap' -type f | head -n 1)
          echo "SNAP_PATH=$SNAP_PATH" >> $GITHUB_ENV

      - name: 'Upload .deb to Release'
        if: env.PUBLISH == 'true'
        run: |
          # Find the .deb file generated by Electron Forge. The path may vary slightly.
          DEB_PATH=$(find ./out/make/deb -name "*.deb" -type f | head -n 1)
          if [ -z "$DEB_PATH" ]; then
            echo "::error::.deb file not found!"
            exit 1
          fi
          echo "Uploading $DEB_PATH to release..."
          gh release upload ${{ env.RELEASE_TAG }} "$DEB_PATH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Upload .snap to Release'
        if: env.PUBLISH == 'true'
        run: |
          # Find the .snap file generated by Electron Forge. The path may vary slightly.
          SNAP_PATH=$(find ./out/make/snap -name "*.snap" -type f | head -n 1)
          if [ -z "$SNAP_PATH" ]; then
            echo "::error::.snap file not found!"
            exit 1
          fi
          echo "Uploading $SNAP_PATH to release..."
          gh release upload ${{ env.RELEASE_TAG }} "$SNAP_PATH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Publish to Snap Store'
        if: env.PUBLISH == 'true'
        uses: snapcore/action-publish@v1
        env:
          # Set the snapcraft credentials env variable
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_LOGIN }}
        with:
          snap: ${{ env.SNAP_PATH }}
          release: edge

  # Generates a software bill of materials and attaches it to the release, so
  # the third-party contents of a shipped build can be looked up later. Kept as
  # a separate job so a failure here can't block the installer uploads.
  sbom:
    runs-on: ubuntu-latest

    # The bill of materials describes a release, so it is only worth producing when
    # this run is actually publishing one. Spelled out rather than reusing the
    # PUBLISH variable because the env context is not available in a job-level if.
    if: github.event_name == 'release' || inputs.upload

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # node_modules is what gets scanned, so it has to be installed first.
      - name: 'Install Dependencies'
        run: npm ci

      # Two invocations, as the action emits a single format per run.
      # Exclusions are read from .syft.yaml.
      - name: 'Generate SBOM (CycloneDX)'
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: xibo-player-${{ env.RELEASE_TAG }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: 'Generate SBOM (Syft native)'
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: syft-json
          output-file: xibo-player-${{ env.RELEASE_TAG }}.syft.json
          upload-artifact: false
          upload-release-assets: false

      # An empty SBOM still parses as valid, so check it before uploading.
      - name: 'Verify SBOM'
        run: |
          CDX="xibo-player-${{ env.RELEASE_TAG }}.cdx.json"
          SYFT="xibo-player-${{ env.RELEASE_TAG }}.syft.json"

          for f in "$CDX" "$SYFT"; do
            if [ ! -s "$f" ]; then
              echo "::error::$f was not created. The 'Generate SBOM' step above produced no file."
              exit 1
            fi
          done

          COUNT=$(grep -o '"pkg:npm/' "$CDX" | wc -l)
          echo "npm components found: $COUNT"
          if [ "$COUNT" -lt 100 ]; then
            echo "::error::Only $COUNT npm components found, expected several hundred. The scan did not work. Check the 'Generate SBOM' steps above."
            exit 1
          fi

      - name: 'Upload SBOM to Release'
        run: |
          gh release upload ${{ env.RELEASE_TAG }} \
            "xibo-player-${{ env.RELEASE_TAG }}.cdx.json" \
            "xibo-player-${{ env.RELEASE_TAG }}.syft.json" \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Windows ships two installers while the move to the MSI is in progress: the
  # machine-wide MSI, which is the one that can replace the legacy .NET player and
  # be deployed by Group Policy, and the existing per-user Squirrel .exe, which
  # stays the supported method until the MSI has been proven in the field.
  #
  # The job is deliberately split into package / sign / make / sign rather than a
  # single `npm run make`. Windows verifies the signature on the file being run,
  # so the application's own binaries have to be signed BEFORE they are packed
  # into an installer, and the installer signed after it is built. Signing the
  # installer first and then changing its contents invalidates the signature.
  build-windows:
    runs-on: windows-latest

    if: github.event_name == 'release' || inputs.platforms != 'linux'

    environment:
      name: 'artifact-signing'

    permissions:
      contents: write # gh release upload
      id-token: write # federated credential for Azure sign-in

    env:
      # The UI extension is a separate package that must match the toolset's own
      # major version, so both are pinned to one value.
      WIX_VERSION: '6.0.0'

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v5

      - name: 'Setup Node.js'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: 'Setup MSVC Developer Command Prompt'
        uses: ilammy/msvc-dev-cmd@v1

      # WiX is a .NET global tool, pinned so the installer is reproducible. The UI
      # extension supplies the dialogs shown when the MSI is run by hand; asking
      # for it without a version resolves to a later major, which WiX rejects.
      - name: 'Install WiX Toolset'
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add -g WixToolset.UI.wixext/$env:WIX_VERSION
          wix --version
          wix extension list -g
        shell: powershell

      - name: 'Install Dependencies'
        run: npm ci
        shell: powershell

      - name: 'Build Application Bundles'
        run: npm run build
        shell: powershell

      # Produces out/xibo-player-win32-x64/. Kept separate from `make` so the
      # binaries can be signed in between.
      - name: 'Package Application'
        run: npx electron-forge package --platform win32 --arch x64
        shell: powershell

      # Signing runs unconditionally; the 'artifact-signing' environment on this
      # job is what holds the credentials and gates access to them. A release cut
      # before Microsoft's organisation identity validation completes will fail
      # here rather than publish unsigned installers.
      - name: 'Azure Sign-in'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Sign Application Binaries'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\out\xibo-player-win32-x64
          files-folder-filter: exe,dll,node
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: 'Xibo Digital Signage Player'
          description-url: 'https://xibosignage.com'

      # --skip-package reuses the directory signed above instead of rebuilding it.
      - name: 'Build Installers'
        run: npx electron-forge make --skip-package --platform win32 --arch x64
        shell: powershell

      - name: 'Sign Installers'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\out\make
          files-folder-filter: exe,msi
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: 'Xibo Digital Signage Player'
          description-url: 'https://xibosignage.com'

      # Trusting the signing step's exit code is not enough; check the artefacts
      # that are actually about to be published.
      - name: 'Verify Installer Signatures'
        run: |
          $installers = Get-ChildItem -Path "./out/make" -File -Recurse |
            Where-Object { $_.Extension -match "^\.(exe|msi)$" }

          $unsigned = @()
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            Write-Host "$($installer.Name): $($signature.Status)"
            if ($signature.Status -ne "Valid") { $unsigned += $installer.Name }
          }

          if ($unsigned.Count -gt 0) {
            Write-Error "Unsigned or invalidly signed installers: $($unsigned -join ', ')"
            exit 1
          }
        shell: powershell

      - name: 'Upload Installers to Release'
        if: env.PUBLISH == 'true'
        run: |
          $installers = Get-ChildItem -Path "./out/make" -File -Recurse |
            Where-Object { $_.Extension -match "^\.(exe|msi)$" }

          if ($installers.Count -eq 0) {
            Write-Error "No installer file (.exe or .msi) found in ./out/make/"
            exit 1
          }

          foreach ($installer in $installers) {
            Write-Host "Uploading $($installer.FullName)"
            gh release upload ${{ env.RELEASE_TAG }} "$($installer.FullName)" --clobber
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
